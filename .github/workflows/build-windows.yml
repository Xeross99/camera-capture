name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # tag vX.Y.Z = wydanie: paczka laduje w GitHub Releases, skad .exe
    # u operatora sam ja pobiera (patrz src/updater.py)
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) { throw "Tag $tag != APP_VERSION $ver — podbij src/version.py przed tagowaniem." }
          echo "Wydanie $ver"

      - name: Install dependencies
        run: pip install -r requirements-windows.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm CameraCapture.spec

      - name: Include .env template
        run: copy .env.example dist\CameraCapture\.env.example

      - uses: actions/upload-artifact@v7
        with:
          name: CameraCapture-windows
          path: dist/CameraCapture
          # bez tego .env.example (dotfile) wypada z paczki
          include-hidden-files: true

      # Zip pakowany Z POZIOMU katalogu (na wierzchu .exe i _internal/) —
      # updater kopiuje zawartosc obok istniejacego .exe, wiec .env i photos/
      # operatora zostaja nietkniete.
      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\CameraCapture\* -DestinationPath CameraCapture-windows-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} "CameraCapture-windows-${{ github.ref_name }}.zip" --title "Camera Capture ${{ github.ref_name }}" --generate-notes
