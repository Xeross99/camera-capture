name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # tag vX.Y.Z = wydanie: paczka laduje w GitHub Releases, skad .exe
    # u operatora sam ja pobiera (patrz src/updater.py)
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Testy (pytest tests/) na tym samym systemie co operator. Build i wydanie
  # ruszaja TYLKO po zielonych testach. Pakiety testowe (requirements-dev.txt)
  # i katalog tests/ nie trafiaja do .exe — build ich nie instaluje, a paczka
  # bierze wylacznie to, co importuje gui.py.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-windows.txt -r requirements-dev.txt
          python -m playwright install chromium

      # model rembg (~4,5 MB) pobierany przy pierwszej obrobce — cache miedzy runami
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-u2netp

      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) { throw "Tag $tag != APP_VERSION $ver — podbij src/version.py przed tagowaniem." }
          echo "Wydanie $ver"

      - name: Install dependencies
        run: pip install -r requirements-windows.txt pyinstaller

      # repo wydan jest prywatne, wiec .exe pyta o aktualizacje z tokenem tylko
      # do odczytu (fine-grained, Contents: read na trixbrix/CameraCapture);
      # plik jest poza gitem, trafia wylacznie do zbudowanej paczki
      - name: Embed update token
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if (-not $env:UPDATE_TOKEN) { throw "Brak sekretu UPDATE_TOKEN — bez niego .exe nie zobaczy zadnej aktualizacji." }
          Set-Content -Path src/update_token.py -Encoding utf8 -Value "UPDATE_TOKEN = `"$env:UPDATE_TOKEN`""

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm CameraCapture.spec

      - name: Include .env template
        run: copy .env.example dist\CameraCapture\.env.example

      - uses: actions/upload-artifact@v7
        with:
          name: CameraCapture-windows
          path: dist/CameraCapture
          # bez tego .env.example (dotfile) wypada z paczki
          include-hidden-files: true

      # Wydanie leci SAMO z pushu na main: bierzemy APP_VERSION i publikujemy
      # v<APP_VERSION>, o ile takiego release'a jeszcze nie ma. Dzieki temu
      # "commit and push" = nowa wersja u operatora, bez recznego tagowania
      # (tag zaklada samo `gh release create` na biezacym commicie).
      #
      # Zip pakowany Z POZIOMU katalogu (na wierzchu .exe i _internal/) —
      # updater kopiuje zawartosc obok istniejacego .exe, wiec .env i photos/
      # operatora zostaja nietkniete.
      - name: Publish release for APP_VERSION
        # wydanie tylko z main — reczny run na innej galezi = same testy + build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          # samo sprawdzenie "czy jest": brak release'a to normalny wynik, nie blad,
          # wiec gasimy stderr i ErrorActionPreference na czas tego wywolania
          $ErrorActionPreference = 'Continue'
          gh release view $tag > $null 2> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            Write-Host "Release $tag juz istnieje — podbij APP_VERSION, zeby wydac nowa wersje."
            exit 0
          }
          $zip = "CameraCapture-windows-$tag.zip"
          Compress-Archive -Path dist\CameraCapture\* -DestinationPath $zip
          gh release create $tag $zip --title "Camera Capture $tag" --generate-notes --target $env:GITHUB_SHA
          Write-Host "Opublikowano $tag"

      # Zostaje tylko wydanie biezacej wersji: starsze (z paczkami po ~150 MB)
      # sa usuwane. Tagi w git zostaja — historia wersji jest dalej w repo.
      # Updater pyta o releases/latest, wiec usuniecie starszych niczego mu nie
      # zabiera. Krok idzie tez wtedy, gdy wydanie juz istnialo (push bez
      # podbicia wersji), wiec sprzata zalegle.
      - name: Remove older releases
        # wydanie tylko z main — reczny run na innej galezi = same testy + build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          # bez wydania biezacej wersji niczego nie kasujemy — inaczej nieudana
          # publikacja zostawilaby repo bez zadnego wydania
          gh release view $tag > $null
          if ($LASTEXITCODE -ne 0) { throw "Brak wydania $tag — nie usuwam starszych." }
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne $tag }
          foreach ($t in $old) {
            gh release delete $t --yes
            Write-Host "Usunieto wydanie $t (tag zostaje)"
          }
