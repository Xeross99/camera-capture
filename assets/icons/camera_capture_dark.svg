<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Camera Capture">
  <title>Camera Capture</title>
  <defs>
    <g id="tbx" fill="none" stroke-linecap="round">
      <g stroke-linejoin="round" stroke-width="48">
        <polyline points="160,62 250,152 340,62"/>
        <polyline points="160,438 250,348 340,438"/>
        <polyline points="62,160 152,250 62,340"/>
        <polyline points="438,160 348,250 438,340"/>
      </g>
      <g stroke-width="16" stroke-linecap="butt">
        <line x1="88" y1="134" x2="134" y2="88"/><line x1="366" y1="88" x2="412" y2="134"/>
        <line x1="88" y1="366" x2="134" y2="412"/><line x1="366" y1="412" x2="412" y2="366"/>
        <line x1="176" y1="226" x2="226" y2="176"/><line x1="274" y1="176" x2="324" y2="226"/>
        <line x1="176" y1="274" x2="226" y2="324"/><line x1="274" y1="324" x2="324" y2="274"/>
      </g>
    </g>
  </defs>
  <!-- wizjer -->
  <rect x="168" y="78" width="176" height="84" rx="26" fill="#e6e9f2"/>
  <!-- korpus -->
  <rect x="32" y="128" width="448" height="320" rx="72" fill="#e6e9f2"/>
  <!-- dioda -->
  <circle cx="404" cy="188" r="16" fill="#ef4444"/>
  <!-- obiektyw: niebieski pierścień, biała szyba, znak Trixbrix -->
  <circle cx="256" cy="288" r="128" fill="#2563eb"/>
  <circle cx="256" cy="288" r="104" fill="#ffffff"/>
  <use href="#tbx" stroke="#131a33" transform="translate(256 288) scale(0.34) translate(-250 -250)"/>
</svg>
