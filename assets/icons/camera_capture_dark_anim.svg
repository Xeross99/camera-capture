<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Camera Capture">
  <title>Camera Capture</title>
  <style>
    /* „pstryk" co 3,6 s: obiektyw lekko się przymyka, błysk na szybie,
       znak Trixbrix obraca się o ćwierć obrotu, dioda mruga */
    .lens { transform-origin: 256px 288px; transform-box: view-box; animation: shutter 3.6s cubic-bezier(.34,1.56,.64,1) infinite; }
    .mark { transform-origin: 256px 288px; transform-box: view-box; animation: spin 3.6s cubic-bezier(.65,0,.35,1) infinite; }
    .flash { opacity: 0; animation: flash 3.6s ease-out infinite; }
    .led { animation: led 3.6s steps(1) infinite; }
    .body { transform-origin: 256px 448px; transform-box: view-box; animation: press 3.6s ease-out infinite; }
    @keyframes shutter { 0%, 62%, 100% { transform: scale(1); } 68% { transform: scale(.9); } 78% { transform: scale(1.03); } 86% { transform: scale(1); } }
    @keyframes spin { 0%, 64% { transform: rotate(0deg); } 84%, 100% { transform: rotate(90deg); } }
    @keyframes flash { 0%, 66% { opacity: 0; } 69% { opacity: .95; } 80%, 100% { opacity: 0; } }
    @keyframes led { 0%, 64% { opacity: 1; } 66% { opacity: .2; } 70% { opacity: 1; } 72% { opacity: .2; } 74%, 100% { opacity: 1; } }
    @keyframes press { 0%, 64%, 100% { transform: scale(1); } 67% { transform: scale(.985, .97); } 74% { transform: scale(1); } }
  </style>
  <defs>
    <g id="tbx" fill="none" stroke-linecap="round">
      <g stroke-linejoin="round" stroke-width="48">
        <polyline points="160,62 250,152 340,62"/>
        <polyline points="160,438 250,348 340,438"/>
        <polyline points="62,160 152,250 62,340"/>
        <polyline points="438,160 348,250 438,340"/>
      </g>
      <g stroke-width="16" stroke-linecap="butt">
        <line x1="88" y1="134" x2="134" y2="88"/><line x1="366" y1="88" x2="412" y2="134"/>
        <line x1="88" y1="366" x2="134" y2="412"/><line x1="366" y1="412" x2="412" y2="366"/>
        <line x1="176" y1="226" x2="226" y2="176"/><line x1="274" y1="176" x2="324" y2="226"/>
        <line x1="176" y1="274" x2="226" y2="324"/><line x1="274" y1="324" x2="324" y2="274"/>
      </g>
    </g>
  </defs>
  <g class="body">
  <!-- wizjer -->
  <rect x="168" y="78" width="176" height="84" rx="26" fill="#e6e9f2"/>
  <!-- korpus -->
  <rect x="32" y="128" width="448" height="320" rx="72" fill="#e6e9f2"/>
  <!-- dioda -->
  <circle class="led" cx="404" cy="188" r="16" fill="#ef4444"/>
  <!-- obiektyw: niebieski pierścień, biała szyba, znak Trixbrix -->
  <g class="lens">
    <circle cx="256" cy="288" r="128" fill="#2563eb"/>
    <circle cx="256" cy="288" r="104" fill="#ffffff"/>
    <g class="mark"><use href="#tbx" stroke="#131a33" transform="translate(256 288) scale(0.34) translate(-250 -250)"/></g>
    <circle class="flash" cx="256" cy="288" r="104" fill="#ffffff"/>
  </g>
  </g>
</svg>
