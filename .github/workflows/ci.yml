name: Camera Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    # tag vX.Y.Z = wydanie: paczka laduje w GitHub Releases, skad .exe
    # u operatora sam ja pobiera (patrz src/updater.py)
    tags: ["v*"]

permissions:
  contents: write
  # kasowanie artefaktu buildu po wydaniu (krok "Delete build artifact")
  actions: write

# Nowy push na te sama galaz anuluje starszy, niedokonczony przebieg — przy
# kilku szybkich pushach wydaje sie tylko najnowsza wersja, a nie kazda po kolei
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testy (pytest tests/) na tym samym systemie co operator. Build i wydanie
  # ruszaja TYLKO po zielonych testach. Pakiety testowe (requirements-dev.txt)
  # i katalog tests/ nie trafiaja do .exe — build ich nie instaluje, a paczka
  # bierze wylacznie to, co importuje gui.py.
  test:
    name: 1. Tests · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, reqs: requirements-windows.txt }
          - { label: macOS, os: macos-latest, reqs: requirements.txt }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r ${{ matrix.reqs }} -r requirements-dev.txt
          python -m playwright install chromium

      # model rembg (~4,5 MB) pobierany przy pierwszej obrobce — cache miedzy runami
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-u2netp

      - name: Run tests
        run: python -m pytest -q

  build-windows:
    name: 2. Build · Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) { throw "Tag $tag != APP_VERSION $ver — podbij src/version.py przed tagowaniem." }
          echo "Wydanie $ver"

      - name: Install dependencies
        run: pip install -r requirements-windows.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm CameraCapture.spec

      - name: Include .env template
        run: copy .env.example dist\CameraCapture\.env.example

      - uses: actions/upload-artifact@v7
        with:
          name: CameraCapture-windows
          path: dist/CameraCapture
          # bez tego .env.example (dotfile) wypada z paczki
          include-hidden-files: true
          # artefakt to tylko przekazanie paczki do joba wydania (paczka
          # zostaje w Releases); ~145 MB z domyslnymi 90 dniami zjadalo
          # darmowy limit storage Actions
          retention-days: 1

  # Camera Capture.app dla macOS (Apple Silicon — runner macos-latest to arm64).
  # Bez podpisu Apple. W zipie katalog „Camera Capture" z .app i .env.example:
  # EDSDK.framework, .env i photos/ kladzie sie obok .app (src/config.py).
  # Pakowane `ditto`, bo zwykly zip gubi symlinki frameworkow w .app.
  build-macos:
    name: 2. Build · macOS (.app)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm CameraCapture.spec

      - name: Package
        run: |
          mkdir -p "pkg/Camera Capture"
          mv "dist/Camera Capture.app" "pkg/Camera Capture/"
          cp .env.example "pkg/Camera Capture/.env.example"
          ditto -c -k --keepParent "pkg/Camera Capture" CameraCapture-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: CameraCapture-macos
          path: CameraCapture-macos.zip
          retention-days: 1

  # Wydania dopiero po zielonym buildzie, i tylko z main — reczny run na innej
  # galezi to same testy + build. Kazdy system ma OSOBNE wydanie (vX.Y.Z-windows
  # i vX.Y.Z-macos) z jedna paczka; aplikacja bierze najnowsze wydanie ze swoja
  # paczka (src/updater.py). Wydanie Windows jest oznaczone jako „Latest" —
  # starsze .exe pytaja wlasnie o releases/latest i dalej znajda swoja paczke.
  #
  # Wydanie leci SAMO z pushu na main: bierzemy APP_VERSION i publikujemy, o ile
  # takiego wydania jeszcze nie ma — "commit and push" = nowa wersja u
  # operatora, bez recznego tagowania (tag zaklada `gh release create`).
  #
  # Starsze wydania tego systemu sa usuwane razem z tagami (--cleanup-tag),
  # wiec w repo zostaje po jednym wydaniu na system. Updater pyta o najnowsze,
  # wiec usuniecie starszych niczego mu nie zabiera.
  release-windows:
    name: 3. Release · Windows
    needs: build-windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: CameraCapture-windows
          path: dist/CameraCapture

      # Zip pakowany Z POZIOMU katalogu (na wierzchu .exe i _internal/) —
      # updater kopiuje zawartosc obok istniejacego .exe, wiec .env i photos/
      # operatora zostaja nietkniete.
      - name: Publish Windows release for APP_VERSION
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver-windows"
          # samo sprawdzenie "czy jest": brak wydania to normalny wynik, nie blad
          $ErrorActionPreference = 'Continue'
          gh release view $tag > $null 2> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            Write-Host "Wydanie $tag juz istnieje — podbij APP_VERSION, zeby wydac nowa wersje."
          } else {
            # nazwa paczki z „windows" — updater .exe szuka jej po tym slowie
            $zip = "CameraCapture-windows-v$ver.zip"
            Compress-Archive -Path dist\CameraCapture\* -DestinationPath $zip
            gh release create $tag $zip --title "Camera Capture $ver · Windows" --generate-notes --target $env:GITHUB_SHA --latest
            Write-Host "Opublikowano $tag"
          }

      # Usuwa starsze wydania Windows i dawne wspolne wydania (tag bez systemu,
      # sprzed rozdzielenia). Bez wydania biezacej wersji niczego nie kasujemy —
      # nieudana publikacja nie moze zostawic repo bez wydania.
      - name: Remove older Windows releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver-windows"
          gh release view $tag > $null
          if ($LASTEXITCODE -ne 0) { throw "Brak wydania $tag — nie usuwam starszych." }
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne $tag -and ($_ -like '*-windows' -or $_ -notlike '*-*') }
          foreach ($t in $old) {
            gh release delete $t --yes --cleanup-tag
            Write-Host "Usunieto wydanie i tag $t"
          }

      # Paczka jest juz w Releases — artefakt nie musi czekac na retention-days.
      # Przy nieudanym wydaniu zostaje (ponowienie joba go pobiera).
      - name: Delete build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "CameraCapture-windows") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              echo "Usunieto artefakt CameraCapture-windows ($id)"
            done

  release-macos:
    name: 3. Release · macOS
    needs: build-macos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: CameraCapture-macos
          path: dist-macos

      - name: Publish macOS release for APP_VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' src/version.py)
          tag="v$ver-macos"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Wydanie $tag juz istnieje — podbij APP_VERSION, zeby wydac nowa wersje."
          else
            zip="CameraCapture-macos-v$ver.zip"
            mv dist-macos/CameraCapture-macos.zip "$zip"
            gh release create "$tag" "$zip" --title "Camera Capture $ver · macOS" --generate-notes --target "$GITHUB_SHA" --latest=false
            echo "Opublikowano $tag"
          fi

      - name: Remove older macOS releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' src/version.py)
          tag="v$ver-macos"
          gh release view "$tag" >/dev/null || { echo "Brak wydania $tag — nie usuwam starszych."; exit 1; }
          # pipefail: brak starszych wydan (grep bez trafien) to nie blad
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            { grep -- '-macos$' || true; } | { grep -vx -- "$tag" || true; } |
            while read -r t; do
              gh release delete "$t" --yes --cleanup-tag
              echo "Usunieto wydanie i tag $t"
            done

      # Paczka jest juz w Releases — artefakt nie musi czekac na retention-days.
      # Przy nieudanym wydaniu zostaje (ponowienie joba go pobiera).
      - name: Delete build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "CameraCapture-macos") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              echo "Usunieto artefakt CameraCapture-macos ($id)"
            done
